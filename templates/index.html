<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NLP - Emotion Detection</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
          crossorigin="anonymous">
    <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
    <style>
        body { background: #f4f6f9; }
        .app-card { max-width: 760px; margin: 40px auto; }
        #system_response { min-height: 3.5rem; white-space: pre-wrap; }
    </style>
</head>
<body>
    <main class="container">
        <div class="card shadow-sm app-card">
            <div class="card-body p-4">
                <h1 class="text-center mb-4">NLP - Emotion Detection</h1>

                <div class="form-group">
                    <label for="textToAnalyze" class="h5">Please enter the text to be analyzed</label>
                    <textarea class="form-control" id="textToAnalyze" rows="4"
                              placeholder="e.g. I love this new product, it works perfectly!"></textarea>
                    <small class="form-text text-muted">Tip: press Ctrl+Enter to analyze.</small>
                </div>

                <button id="analyzeButton" type="button" class="btn btn-primary"
                        onclick="RunEmotionDetection()">Run Emotion Detection</button>

                <h2 class="h5 mt-5">Result of Emotion Detection</h2>
                <div id="system_response" class="border rounded p-3 bg-light text-muted"
                     role="status" aria-live="polite">Results will appear here.</div>
            </div>
        </div>
    </main>
</body>
</html>
